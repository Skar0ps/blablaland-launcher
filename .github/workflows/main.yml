name: Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.*'

permissions:
  contents: write

jobs:
  build_windows_linux:
    name: Build for Windows & Linux
    runs-on: ubuntu-latest
    container:
      image: electronuserland/builder:wine
      options: --user 1001
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # --publish always : electron-builder publie lui-même artefacts ET métadonnées
      # (latest.yml / latest-linux.yml requis par electron-updater). Ces yml ne sont PAS
      # générés avec --publish never, d'où le passage à always (le provider github est
      # déclaré dans electron-builder.yml). Sur tag uniquement, sinon build local sans publish.
      - name: Build & Publish Windows (NSIS + Portable) & Linux (AppImage + deb + rpm)
        if: startsWith(github.ref, 'refs/tags/v')
        run: yarn release --win --linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Hors tag (workflow_dispatch sur une branche) : build seul, sans publication.
      - name: Build only (no publish, non-tag runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: yarn package --win --linux

  build_macos:
    name: Build for macOS
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build macOS app (sans DMG, x64 uniquement)
        run: yarn electron-builder --mac --x64 --dir

      - name: Signature ad-hoc du .app
        run: codesign --force --deep --sign - "release/mac/Blablastrae Launcher.app"

      - name: Package DMG à partir du .app signé
        run: |
          yarn electron-builder --mac dmg --x64 --publish never \
            --prepackaged "release/mac/Blablastrae Launcher.app"

      - name: Creer le bundle macOS (DMG + script + lisez-moi)
        run: |
          chmod +x "build/Installer Blablastrae.command"
          zip -j "release/Blablastrae-Launcher-macOS.zip" \
            release/*.dmg \
            "build/Installer Blablastrae.command" \
            "build/LISEZ_MOI_IMPORTANT.txt"

      - name: Publish macOS to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: release/Blablastrae-Launcher-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
